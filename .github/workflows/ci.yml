name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpcs

      - name: PHP syntax lint (all files)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Magento 2 coding standard
        run: |
          composer global require magento/magento-coding-standard --no-interaction
          ~/.composer/vendor/bin/phpcs --standard=Magento2 \
            --extensions=php,phtml --ignore=*/vendor/* . || true
